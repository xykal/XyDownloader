# Cloudflare Worker — proxy streaming untuk DownloadAja
# Deploy: npx wrangler deploy   (secret: npx wrangler secret put SIGNING_KEY)
name = "xydl-proxy"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true
preview_urls = false

[observability]
enabled = true
head_sampling_rate = 0.05

[[kv_namespaces]]
binding = "QUOTA"
id = "78322af452244f84ba8eabb1f879d667"
