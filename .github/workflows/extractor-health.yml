name: Extractor compatibility probes
on:
  schedule:
    - cron: '40 5 * * 1'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: extractor-health
  cancel-in-progress: false
jobs:
  probes:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Bounded public link probes (no media download)
        run: python scripts/check_extractors_live.py
      - uses: actions/upload-artifact@v4
        with:
          name: extractor-health
          path: extractor-health.json
      - name: Track failures transparently
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const data = JSON.parse(fs.readFileSync('extractor-health.json', 'utf8'));
            const title = 'Extractor compatibility: public sample probes failing';
            const {data: issues} = await github.rest.issues.listForRepo({...context.repo, state: 'open', per_page: 100});
            const issue = issues.find(i => !i.pull_request && i.title === title);
            const body = 'Scheduled public-link probes. These run from CI IPs, not Android devices. A failure can mean anti-bot, login, removed content or an extractor regression.\n\n```json\n' + JSON.stringify(data, null, 2) + '\n```\n\nRun: ' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId;
            if (!data.all_passed) {
              if (issue) await github.rest.issues.update({...context.repo, issue_number: issue.number, body});
              else await github.rest.issues.create({...context.repo, title, body});
              core.setFailed('Some public probes failed; inspect the report. This is not a guarantee that all devices/platforms fail.');
            } else if (issue) {
              await github.rest.issues.update({...context.repo, issue_number: issue.number, state: 'closed'});
            }
