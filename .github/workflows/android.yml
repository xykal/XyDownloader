name: Android APK

# Build APK native (Kotlin + Compose + youtubedl-android + FFmpeg minimal).
# - push ke main  -> APK sebagai artifact + smoke test di emulator (screenshot sebagai artifact)
# - push tag v*   -> GitHub Release berisi APK per arsitektur + gambar popup pembaruan
on:
  # Build + smoke di PR dulu — merge baru kalau hijau. Step Release & notifikasi
  # tetap dijaga `if: tags v*`, jadi PR tidak pernah menyentuh rilis.
  pull_request:
    paths:
      - 'android/**'
      - 'plugins/**'
      - 'licenses/**'
      - '.github/workflows/android.yml'
      - '.github/scripts/**'
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'android/**'
      - 'plugins/**'
      - 'licenses/**'
      - '.github/workflows/android.yml'
      - '.github/scripts/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  BASE_VERSION: '1.3.5'
  NDK_VERSION: '27.2.12479018'

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;${{ env.NDK_VERSION }}'

      - uses: gradle/actions/setup-gradle@v4

      - name: Versi
        id: ver
        run: |
          python3 .github/scripts/version.py "$GITHUB_REF" "$BASE_VERSION" "$GITHUB_RUN_NUMBER" > "$RUNNER_TEMP/version.env"
          cat "$RUNNER_TEMP/version.env" >> "$GITHUB_ENV"
          echo "version=$(sed -n 's/^VERSION_NAME=//p' "$RUNNER_TEMP/version.env")" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/version.env"

      # ---------------------------------------------------------------- FFmpeg minimal (di-cache)
      - name: Cache FFmpeg minimal
        id: ffcache
        uses: actions/cache@v4
        with:
          path: android/ffmpeg/out
          key: ffmpeg-${{ hashFiles('android/ffmpeg/build.sh') }}-ndk${{ env.NDK_VERSION }}

      - name: Build FFmpeg minimal (arm64-v8a, armeabi-v7a, x86_64)
        if: steps.ffcache.outputs.cache-hit != 'true'
        run: |
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/$NDK_VERSION"
          WORK_DIR="$RUNNER_TEMP/ffwork" bash android/ffmpeg/build.sh android/ffmpeg/out arm64-v8a armeabi-v7a x86_64
          ls -la android/ffmpeg/out/*

      # ---------------------------------------------------------------- native lib ramping + yt-dlp terbaru
      - name: Siapkan native lib ramping
        run: python3 android/tools/prepare_native.py --out android/app/build/xy-jni --ffmpeg android/ffmpeg/out

      - name: Bundel yt-dlp terbaru
        run: |
          mkdir -p android/app/build/xy-res/raw
          curl -fsSL --retry 4 -o android/app/build/xy-res/raw/ytdlp https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp
          python3 -c "import zipfile,sys; z=zipfile.ZipFile(sys.argv[1]); v=z.read('yt_dlp/version.py').decode(); print([l for l in v.splitlines() if l.startswith('__version__')])" android/app/build/xy-res/raw/ytdlp

      - name: Siapkan keystore (dari Secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "::error::Release wajib memakai signing key resmi; menolak debug key"
            exit 1
          else
            echo "::warning::Build non-release memakai debug key"
          fi

      - name: Build release APK (R8 + shrink resources)
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rapikan nama file & cek isi APK
        run: |
          mkdir -p out
          for f in android/app/build/outputs/apk/release/*.apk; do
            abi=$(basename "$f" .apk | sed -E 's/^app-//; s/-release(-unsigned)?$//')
            cp "$f" "out/DownloadAja-${VERSION_NAME}-${abi}.apk"
          done
          python3 .github/scripts/check_apk.py out android/app/build/xy-jni android/app/build/xy-res/raw/ytdlp
          cp android/release-banner.webp out/update-banner.webp

      - name: Verify release signature matches previous public APK
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/previous.apk" https://github.com/xykal/XyDownloader/releases/download/v1.3.4/DownloadAja-1.3.4-arm64-v8a.apk
          verifier="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          previous=$("$verifier" verify --print-certs "$RUNNER_TEMP/previous.apk" | grep 'Signer #1 certificate SHA-256 digest:')
          test -n "$previous"
          for apk in out/*.apk; do
            current=$("$verifier" verify --print-certs "$apk" | grep 'Signer #1 certificate SHA-256 digest:')
            test "$previous" = "$current" || { echo "::error::Signing certificate mismatch: $apk"; exit 1; }
          done

      - uses: actions/upload-artifact@v4
        with:
          name: DownloadAja-${{ env.VERSION_NAME }}
          path: out/*.apk
          if-no-files-found: error


  smoke:
    name: Smoke test (emulator)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: DownloadAja-${{ needs.build.outputs.version }}
          path: apk

      - name: Aktifkan KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Jalankan aplikasi di emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash .github/scripts/smoke.sh apk shots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-${{ needs.build.outputs.version }}
          path: shots/

  publish:
    permissions:
      contents: write
      actions: write
    name: Publish signed APK release
    needs: [build, smoke]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      VERSION_NAME: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: DownloadAja-${{ needs.build.outputs.version }}
          path: out
      - name: Release banner and checksums
        run: |
          cp android/release-banner.webp out/update-banner.webp
          cd out
          sha256sum *.apk > SHA256SUMS.txt
      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: DownloadAja ${{ env.VERSION_NAME }}
          files: |
            out/*.apk
            out/update-banner.webp
            out/SHA256SUMS.txt
          body_path: android/RELEASE_NOTES.md

      - name: Kirim notifikasi rilis (OneSignal)
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true   # push notif gagal jangan bikin rilis dianggap gagal
        env:
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
          ONESIGNAL_APP_ID: 8d66b3fd-06ea-4df6-aa39-0487d1cf85aa
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          body = {
              'app_id': os.environ['ONESIGNAL_APP_ID'],
              'headings': {'en': 'DownloadAja ' + os.environ['VERSION_NAME'] + ' sudah rilis'},
              'contents': {'en': 'Ketuk untuk memperbarui \u2014 perbaikan dan fitur baru sudah menunggu.'},
              'included_segments': ['Total Subscriptions'],
              'url': 'https://github.com/xykal/XyDownloader/releases/latest',
              'large_icon': 'https://dlaja.xyverse.my.id/icon-192.png',
          }
          req = urllib.request.Request(
              'https://api.onesignal.com/notifications',
              data=json.dumps(body, ensure_ascii=False).encode('utf-8'),
              headers={'Authorization': 'Key ' + os.environ['ONESIGNAL_REST_API_KEY'],
                       'Content-Type': 'application/json'},
              method='POST')
          try:
              with urllib.request.urlopen(req) as r:
                  out = json.loads(r.read() or b'{}')
              print('notifikasi:', out.get('id') or out.get('errors'))
          except Exception as e:
              print('notifikasi gagal (rilis tetap jalan):', e)
          PY

      # A release created with GITHUB_TOKEN does not trigger release workflows.
      # Explicit dispatch refreshes the Cloudflare manifest after successful publish.
      - name: Refresh production APK links
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
