name: Android APK

# Build APK native (Kotlin + Compose + youtubedl-android + FFmpeg minimal).
# - push ke main  -> APK sebagai artifact + smoke test di emulator (screenshot sebagai artifact)
# - push tag v*   -> GitHub Release berisi APK per arsitektur + gambar popup pembaruan
on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'android/**'
      - 'plugins/**'
      - 'licenses/**'
      - '.github/workflows/android.yml'
      - '.github/scripts/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  BASE_VERSION: '1.2.0'
  NDK_VERSION: '27.2.12479018'

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;${{ env.NDK_VERSION }}'

      - uses: gradle/actions/setup-gradle@v4

      - name: Versi
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="${BASE_VERSION}-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "VERSION_NAME=$V" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------------- FFmpeg minimal (di-cache)
      - name: Cache FFmpeg minimal
        id: ffcache
        uses: actions/cache@v4
        with:
          path: android/ffmpeg/out
          key: ffmpeg-${{ hashFiles('android/ffmpeg/build.sh') }}-ndk${{ env.NDK_VERSION }}

      - name: Build FFmpeg minimal (arm64-v8a, armeabi-v7a, x86_64)
        if: steps.ffcache.outputs.cache-hit != 'true'
        run: |
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/$NDK_VERSION"
          WORK_DIR="$RUNNER_TEMP/ffwork" bash android/ffmpeg/build.sh android/ffmpeg/out arm64-v8a armeabi-v7a x86_64
          ls -la android/ffmpeg/out/*

      # ---------------------------------------------------------------- native lib ramping + yt-dlp terbaru
      - name: Siapkan native lib ramping
        run: python3 android/tools/prepare_native.py --out android/app/build/xy-jni --ffmpeg android/ffmpeg/out

      - name: Bundel yt-dlp terbaru
        run: |
          mkdir -p android/app/build/xy-res/raw
          curl -fsSL --retry 4 -o android/app/build/xy-res/raw/ytdlp https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp
          python3 -c "import zipfile,sys; z=zipfile.ZipFile(sys.argv[1]); v=z.read('yt_dlp/version.py').decode(); print([l for l in v.splitlines() if l.startswith('__version__')])" android/app/build/xy-res/raw/ytdlp

      - name: Siapkan keystore (dari Secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
          else
            echo "::warning::KEYSTORE_BASE64 kosong — APK ditandatangani dengan debug key"
          fi

      - name: Build release APK (R8 + shrink resources)
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rapikan nama file & cek isi APK
        run: |
          mkdir -p out
          for f in android/app/build/outputs/apk/release/*.apk; do
            abi=$(basename "$f" .apk | sed -E 's/^app-//; s/-release(-unsigned)?$//')
            cp "$f" "out/XyDownloader-${VERSION_NAME}-${abi}.apk"
          done
          python3 .github/scripts/check_apk.py out android/app/build/xy-jni android/app/build/xy-res/raw/ytdlp
          cp android/release-banner.webp out/update-banner.webp

      - uses: actions/upload-artifact@v4
        with:
          name: XyDownloader-${{ env.VERSION_NAME }}
          path: out/*.apk
          if-no-files-found: error

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: XyDownloader ${{ env.VERSION_NAME }}
          files: |
            out/*.apk
            out/update-banner.webp
          body_path: android/RELEASE_NOTES.md

  smoke:
    name: Smoke test (emulator)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: XyDownloader-${{ needs.build.outputs.version }}
          path: apk

      - name: Aktifkan KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Jalankan aplikasi di emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash .github/scripts/smoke.sh apk shots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-${{ needs.build.outputs.version }}
          path: shots/
