name: Android APK

# Build APK native (Kotlin + Compose + youtubedl-android).
# - push ke main  -> APK sebagai artifact (untuk testing)
# - push tag v*   -> GitHub Release berisi APK per arsitektur
on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'android/**'
      - 'plugins/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4

      - name: Versi
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION_NAME=1.0.0-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi
          echo "VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Siapkan keystore (dari Secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
          else
            echo "::warning::KEYSTORE_BASE64 kosong — APK ditandatangani dengan debug key"
          fi

      - name: Build release APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rapikan nama file
        run: |
          mkdir -p out
          for f in android/app/build/outputs/apk/release/*.apk; do
            abi=$(basename "$f" .apk | sed -E 's/^app-//; s/-release(-unsigned)?$//')
            cp "$f" "out/XyDownloader-${VERSION_NAME}-${abi}.apk"
          done
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: XyDownloader-${{ env.VERSION_NAME }}
          path: out/*.apk
          if-no-files-found: error

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: XyDownloader ${{ env.VERSION_NAME }}
          files: out/*.apk
          body: |
            ## 📱 XyDownloader ${{ env.VERSION_NAME }} — built in XyVerse

            Download video & MP3 dari TikTok, Douyin, Instagram, YouTube, Bilibili, Kuaishou, X, Facebook, Threads, Vidio & 1.700+ situs lainnya — langsung dari HP.

            **Pilih APK sesuai HP kamu:**
            | File | Untuk |
            |---|---|
            | `…-arm64-v8a.apk` | ✅ Kebanyakan HP Android (2017 ke atas) |
            | `…-armeabi-v7a.apk` | HP lama / 32-bit |
            | `…-x86_64.apk` | Emulator / Chromebook |

            Cara pakai: buka TikTok/IG/YouTube → **Bagikan** → pilih **XyDownloader**. File tersimpan di `Download/XyDownloader`.

            🌐 Versi web: https://xydl.vercel.app
