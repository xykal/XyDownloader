name: Deploy web & proxy

# Backend web (Vercel, Python) + proxy streaming (Cloudflare Worker).
# Jalan otomatis saat ada perubahan di main, dan tiap Senin (redeploy supaya yt-dlp selalu versi terbaru).
on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'xydl/**'
      - 'plugins/**'
      - 'public/**'
      - 'worker/**'
      - 'vercel.json'
      - 'requirements.txt'
      - '.python-version'
      - '.github/workflows/deploy.yml'
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  worker:
    name: Cloudflare Worker (proxy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Deploy worker
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx -y wrangler@4 deploy
      - name: Smoke test
        run: curl -fsS https://xydl-proxy.akuntiktok76y.workers.dev/ | grep -q '"ok":true'

  vercel:
    name: Vercel (web + API Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Deploy production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx -y vercel@latest deploy --prod --yes --force --token "$VERCEL_TOKEN"
      - name: Smoke test
        run: |
          sleep 5
          curl -fsS https://dlaja.projectkal.my.id/api/health | tee /dev/stderr | grep -q '"ok": true'
