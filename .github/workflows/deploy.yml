name: Deploy web & proxy

# APK landing (Cloudflare Worker + static assets). No Vercel/Railway backend.
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'scripts/build_apk_landing.py'
      - 'worker/**'
      - 'dash/**'
      - 'vercel.json'
      - 'requirements.txt'
      - '.python-version'
      - '.github/workflows/deploy.yml'
  schedule:
    - cron: '0 3 * * 1'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  worker:
    name: Cloudflare Worker (proxy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Deploy worker
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx -y wrangler@4 deploy
      - name: Smoke test
        run: curl -fsS https://proxy.xyverse.my.id/ | grep -q '"ok":true'

  dash:
    name: Cloudflare Worker (dash)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Deploy dash
        working-directory: dash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx -y wrangler@4 deploy
      - name: Smoke test dash
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' https://dash.dlaja.xyverse.my.id/api/stats/rebuild)
          test "$code" = "401"   # route ada, terkunci tanpa sesi admin

  web:
    name: Cloudflare (APK landing)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh release manifest
        run: python scripts/build_apk_landing.py
      - name: Deploy APK landing
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx -y wrangler@4 deploy
      - name: Smoke test
        run: |
          curl -fsS https://dlaja.xyverse.my.id/api/health | grep -q '"apk-only"'
          curl -fsS https://dlaja.xyverse.my.id/releases.json | grep -q '"arm64-v8a"'
