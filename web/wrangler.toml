name = "dlaja-web"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true
preview_urls = false

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "404-page"

[observability]
enabled = true
head_sampling_rate = 0.05

[[routes]]
pattern = "dlaja.xyverse.my.id"
custom_domain = true

[[routes]]
pattern = "dlaja.projectkal.my.id"
custom_domain = true
